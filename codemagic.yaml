workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    integrations:
      app_store_connect: Ihsan App
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ihsan.ihsanapp
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get

      - name: Install xcodeproj gem
        script: |
          gem install xcodeproj --no-document

      - name: Add Prayer Widget target
        script: |
          git checkout ios/Runner.xcodeproj/project.pbxproj
          ruby add_widget_target.rb

      - name: Run Flutter analyze (warnings allowed)
        script: flutter analyze || true

      - name: Generate launcher icons
        script: dart run flutter_launcher_icons

      - name: Pod install
        script: |
          cd ios
          pod install

      - name: Install widget provisioning profile
        script: |
          # WIDGET_PROFILE_UUID must be set in Codemagic environment variables
          # Find it: Apple Developer portal → Profiles → Widget → UUID at the top
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$WIDGET_PROFILE" | base64 --decode > "$PROFILES_DIR/PrayerWidget.mobileprovision"

      - name: Build iOS signed
        script: |
          cat > /tmp/export_options.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

            <key>method</key>
            <string>app-store</string>

            <key>teamID</key>
            <string>98Q8PA74RJ</string>

            <key>signingStyle</key>
            <string>manual</string>

            <key>signingCertificate</key>
            <string>Apple Distribution</string>

            <key>provisioningProfiles</key>
            <dict>

              <key>com.ihsan.ihsanapp</key>
              <string>codemagic</string>

              <key>com.ihsan.ihsanapp.PrayerWidget</key>
              <string>codemagic</string>

            </dict>

            <key>manageAppVersionAndBuildNumber</key>
            <false/>

          </dict>
          </plist>
          PLIST

          flutter build ipa --release \
            --export-options-plist=/tmp/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        expire_build_submitted_for_review: true