workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ihsan.ihsanapp
        certificate: Codemagic
        provisioning_profile: Ihsan
    scripts:
      - name: Get Flutter packages
        script: flutter packages pub get
      - name: Run Flutter analyze (warnings allowed)
        script: flutter analyze || true
      - name: Generate launcher icons
        script: dart run flutter_launcher_icons
      - name: Pod install
        script: |
          cd ios
          pod install
      - name: Build iOS signed
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false